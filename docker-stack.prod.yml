services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    command:
      - /bin/bash
      - -ec
      - export MSSQL_SA_PASSWORD="$$(cat /run/secrets/openbrew_sql_sa_password)"; exec /opt/mssql/bin/sqlservr
    volumes:
      - openbrew-prod-sql:/var/opt/mssql
    networks:
      openbrew-internal:
        aliases:
          - db
    secrets:
      - openbrew_sql_sa_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node1
      restart_policy:
        condition: on-failure

  web:
    image: ${OPENBREW_IMAGE}
    environment:
      Environment: prod
      OPENBREW_SQL_HOST: db
      OPENBREW_SQL_PORT: 1433
      OPENBREW_DB_NAME: ${OPENBREW_DB_NAME:-Openbrew_PROD}
      OPENBREW_SQL_ADMIN_USER: sa
      OPENBREW_SA_PASSWORD_FILE: /run/secrets/openbrew_sql_sa_password
      OPENBREW_DB_INIT_SCRIPT: /app/Setup/Database/Build.20150807/20150807_initial.sql
      OPENBREW_HOST_PORT: 8085
      OPENBREW_ROOT_URL: https://openbrew.net
      OPENBREW_ROOT_URL_SECURE: https://openbrew.net
      OPENBREW_STATIC_ROOT_URL: https://openbrew.net
      OPENBREW_STATIC_ROOT_URL_SECURE: https://openbrew.net
      # Recipe images are served by XSP from /Media, so persist them at the
      # corresponding directory beneath the application web root.
      OPENBREW_MEDIA_PHYSICAL_ROOT: /app/Openbrew.Web/Media
      Google_ApplicationKey_FILE: /run/secrets/openbrew_google_application_key
      Google_ApplicationSecret_FILE: /run/secrets/openbrew_google_application_secret
      OPENBREW_CONTACT_EMAIL_ADDRESS: info@openbrew.net
      SMTP_HOST_FILE: /run/secrets/openbrew_smtp_host
      SMTP_PORT_FILE: /run/secrets/openbrew_smtp_port
      SMTP_USERNAME_FILE: /run/secrets/openbrew_smtp_username
      SMTP_PASSWORD_FILE: /run/secrets/openbrew_smtp_password
    volumes:
      - openbrew-prod-media:/app/Openbrew.Web/Media
    secrets:
      - openbrew_sql_sa_password
      - openbrew_google_application_key
      - openbrew_google_application_secret
      - openbrew_smtp_host
      - openbrew_smtp_port
      - openbrew_smtp_username
      - openbrew_smtp_password
    networks:
      - traefik-net
      - openbrew-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-net
        - traefik.http.routers.openbrew-prod.rule=Host(`openbrew.net`)
        - traefik.http.routers.openbrew-prod.entrypoints=http,https
        - traefik.http.routers.openbrew-prod.tls=true
        - traefik.http.routers.openbrew-prod.tls.certResolver=letsEncrypt
        - traefik.http.routers.openbrew-prod.service=openbrew-prod
        - traefik.http.services.openbrew-prod.loadbalancer.server.port=8085
        - traefik.http.services.openbrew-prod.loadbalancer.server.scheme=http

networks:
  traefik-net:
    external: true
  openbrew-internal:
    driver: overlay

volumes:
  openbrew-prod-sql:
  openbrew-prod-media:

secrets:
  openbrew_sql_sa_password:
    external: true
  openbrew_google_application_key:
    external: true
  openbrew_google_application_secret:
    external: true
  openbrew_smtp_host:
    external: true
  openbrew_smtp_port:
    external: true
  openbrew_smtp_username:
    external: true
  openbrew_smtp_password:
    external: true
